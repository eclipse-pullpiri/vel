name: Epic
description: Large initiative that groups related feature requirements
title: "[EPIC] "
labels: ["type:epic", "status:backlog"]
body:
  - type: textarea
    id: goal
    attributes:
      label: 🎯 Goal
      description: What outcome this epic delivers and why it matters
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 📋 Scope
      description: What is included and explicitly excluded
    validations:
      required: false
  - type: textarea
    id: related-features
    attributes:
      label: 📌 Related Features
      description: Linked FEATURE issues (updated as they are created)
      placeholder: |
        - [ ] #
    validations:
      required: false
  - type: textarea
    id: references
    attributes:
      label: 📎 Related Documents/References
    validations:
      required: false
